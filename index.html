<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia Mundial da Qualidade 2026</title>
    <link rel="canonical" href="https://dr1kk0r1be1r0.github.io/qa/">
    <meta property="og:title" content="Dia Mundial da Qualidade 2026">
    <meta property="og:url" content="https://dr1kk0r1be1r0.github.io/qa/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0a2a5e 0%, #051a3d 100%); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
        }
        .top-banner {
            width: 100%;
            padding: 0;
            line-height: 0;
        }
        .top-banner img {
            display: block;
            width: 100%;
            height: auto;
        }
        .page {
            flex: 1;
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .register-subtitle {
            text-align: center;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .container { 
            max-width: 500px; 
            width: 100%;
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
        }
        .content { 
            padding: 30px 20px; 
        }
        .screen { 
            display: none; 
        }
        .screen.active { 
            display: block; 
            animation: fadeIn 0.4s ease; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .welcome-screen { 
            text-align: center; 
        }
        .welcome-logo { 
            margin-bottom: 20px; 
        }
        .welcome-logo img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            display: block; 
            box-shadow: 0 6px 20px rgba(5, 26, 61, 0.35); 
        }
        .welcome-title { 
            font-size: 32px; 
            color: #0a2a5e; 
            font-weight: 700; 
            margin-bottom: 10px; 
        }
        .welcome-subtitle { 
            font-size: 16px; 
            color: #6c757d; 
            margin-bottom: 40px; 
            line-height: 1.6;
        }
        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 15px; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #0a2a5e 0%, #051a3d 100%); 
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(10, 42, 94, 0.4); 
        }
        .btn-back { 
            background: #6c757d; 
            color: white; 
        }
        .btn-back:hover { 
            background: #5a6268; 
            transform: translateY(-2px); 
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #495057; 
            font-size: 14px; 
        }
        .form-group label .required { 
            color: #dc3545; 
        }
        .form-group input { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #dee2e6; 
            border-radius: 10px; 
            font-size: 15px; 
            transition: border-color 0.3s ease; 
        }
        .form-group input:focus { 
            outline: none; 
            border-color: #0a2a5e; 
        }
        .message { 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            text-align: center; 
            font-size: 14px; 
            display: none; 
        }
        .message.success { 
            background: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
            display: block; 
        }
        .message.error { 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
            display: block; 
        }
        .info-box {
            background: #e7eefb;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #0a2a5e;
            margin-bottom: 20px;
        }
        .info-box h3 {
            color: #0a2a5e;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .info-box p {
            font-size: 14px;
            color: #495057;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>

                <h2 class="welcome-title">Bem-vindo!</h2>
                <p class="welcome-subtitle">Participe do sorteio ao Test Drive do Dia Mundial da Qualidade.</p>
                <button class="btn btn-primary" onclick="showScreen('registerScreen')">📝 Cadastre-se</button>
            </div>
        </div>
        
        <!-- Tela de Cadastro -->
        <div id="registerScreen" class="screen">
            <div class="content">
                <p class="register-subtitle">Preencha seus dados para o cadastro</p>
                <div id="registerMessage" class="message"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Nome Completo <span class="required">*</span></label>
                        <input type="text" id="regName" required placeholder="Digite seu nome completo">
                    </div>
                    <div class="form-group">
                        <label>Empresa <span class="required">*</span></label>
                        <input type="text" id="regEmpresa" required placeholder="Digite o nome da empresa">
                    </div>
                    <div class="form-group">
                        <label>Chapa</label>
                        <input type="number" id="regChapa" placeholder="Digite o número da chapa (opcional)">
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="regEmail" required placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Data de Nascimento <span class="required">*</span></label>
                        <input type="date" id="regNascimento" required max="9999-12-31">
                    </div>
                    <div class="form-group">
                        <label>Área <span class="required">*</span></label>
                        <input type="text" id="regArea" required placeholder="Digite sua área">
                    </div>
                    <div class="form-group">
                        <label>Telefone <span class="required">*</span></label>
                        <input type="tel" id="regTelefone" required inputmode="numeric" maxlength="15" placeholder="(xx) xxxxx xxxx" pattern="\(\d{2}\) \d{5} \d{4}" title="Digite DDD + número no formato (xx) xxxxx xxxx">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">✅ Enviar Cadastro</button>
                    <button type="button" class="btn btn-back" onclick="showScreen('homeScreen')">← Voltar</button>
                </form>
            </div>
        </div>
    </div>
    </div>

    <script>
        const CONFIG = {
            formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSe6mDtbbcF-rDFaGJjcdWuo_Sk6q7SxjWWGmoXTOaFOxCdN4Q/formResponse',
            formFields: {
                nascimento: 'entry.2052661114', // Data de Nascimento
                name: 'entry.887558715',
                empresa: 'entry.491763686',
                chapa: 'entry.961839605',
                email: 'entry.1388428156',
                area: 'entry.132958547',
                telefone: 'entry.1953826271'
            }
        };

        // Máscara do telefone: só números, formato (xx) xxxxx xxxx
        document.getElementById('regTelefone').addEventListener('input', function() {
            const d = this.value.replace(/\D/g, '').slice(0, 11);
            let out = d;
            if (d.length > 7) out = '(' + d.slice(0,2) + ') ' + d.slice(2,7) + ' ' + d.slice(7);
            else if (d.length > 2) out = '(' + d.slice(0,2) + ') ' + d.slice(2);
            else if (d.length > 0) out = '(' + d;
            this.value = out;
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showMessage(elementId, text, type) {
            const msg = document.getElementById(elementId);
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    msg.style.display = 'none';
                }, 3000);
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Enviando...';

            const data = {
                name: document.getElementById('regName').value.trim(),
                empresa: document.getElementById('regEmpresa').value.trim(),
                chapa: document.getElementById('regChapa').value.trim() || '',
                email: document.getElementById('regEmail').value.trim(),
                area: document.getElementById('regArea').value.trim(),
                telefone: document.getElementById('regTelefone').value.trim(),
                nascimento: document.getElementById('regNascimento').value
            };

            // Validação básica
            if (!data.name || !data.empresa || !data.email) {
                showMessage('registerMessage', '⚠️ Por favor, preencha todos os campos obrigatórios!', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Enviar Cadastro';
                return;
            }

            if (!data.area || !data.nascimento) {
                showMessage('registerMessage', '⚠️ Por favor, preencha todos os campos obrigatórios!', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Enviar Cadastro';
                return;
            }

            // Validação de telefone (DDD + 9 dígitos)
            if (data.telefone.replace(/\D/g, '').length !== 11) {
                showMessage('registerMessage', '⚠️ Telefone inválido. Use DDD + número: (xx) xxxxx xxxx', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Enviar Cadastro';
                return;
            }

            // Validação de email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(data.email)) {
                showMessage('registerMessage', '⚠️ Por favor, insira um email válido!', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Enviar Cadastro';
                return;
            }

            try {
                await sendToGoogleForms(data);
                showMessage('registerMessage', '✅ Cadastro realizado com sucesso!', 'success');
                
                // Limpar formulário
                document.getElementById('registerForm').reset();
                
                // Voltar para tela inicial após 2 segundos
                setTimeout(() => {
                    showScreen('homeScreen');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ Enviar Cadastro';
                }, 2000);
                
            } catch (error) {
                console.error('Erro ao enviar dados:', error);
                showMessage('registerMessage', '❌ Erro ao enviar cadastro. Tente novamente.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Enviar Cadastro';
            }
        });

        async function sendToGoogleForms(data) {
            const formData = new FormData();
            formData.append(CONFIG.formFields.name, data.name);
            formData.append(CONFIG.formFields.empresa, data.empresa);
            formData.append(CONFIG.formFields.chapa, data.chapa || 'Não informado');
            formData.append(CONFIG.formFields.email, data.email);
            formData.append(CONFIG.formFields.area, data.area);
            const t = data.telefone.replace(/\D/g, '');
            formData.append(CONFIG.formFields.telefone, t.slice(0,2) + ' ' + t.slice(2,7) + ' ' + t.slice(7));

            // Data de Nascimento (Google Forms recebe ano/mês/dia separados)
            const [ano, mes, dia] = data.nascimento.split('-');
            formData.append(CONFIG.formFields.nascimento + '_year', parseInt(ano, 10));
            formData.append(CONFIG.formFields.nascimento + '_month', parseInt(mes, 10));
            formData.append(CONFIG.formFields.nascimento + '_day', parseInt(dia, 10));

            console.log('Enviando dados para o formulário...');
            console.log('URL:', CONFIG.formUrl);

            await fetch(CONFIG.formUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            });

            console.log('Cadastro enviado com sucesso!');
        }
    </script>
</body>
</html>
